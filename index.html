<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panyuting | Personal Website</title>

    <link rel="stylesheet" href="style.css">

    <script>
        function showMessage() {
            alert("欢迎来到我的个人网站 ✨");
        }

</head>

<body>

    <div class="background"></div>

    <div class="container">

        <div class="card">

            <img
                class="avatar"
                src="avatar.jpg"
                alt="头像"

            <h1>Panyuting ✨</h1>

            <p class="intro">
                Frontend Learner · Creative Developer · GitHub Explorer
            </p>

            <button onclick="showMessage()">
                联系我

        </div>

        <div class="projects">

            <h2>我的项目</h2>

            <div class="project-grid">

                <div class="project-card">
                    <h3>🌐 Personal Website</h3>
                    <p>我的第一个个人网站项目</p>
                </div>

                <div class="project-card">
                    <h3>🚀 Future Project</h3>
                    <p>正在开发中...</p>
                </div>

                <div class="project-card">
                    <h3>🎨 UI Design</h3>
                    <p>练习现代网页设计</p>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
