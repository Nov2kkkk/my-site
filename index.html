<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panyuting Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <img class="avatar" src="avatar.jpg" alt="头像">

            <h1>你好，我是 Panyuting 👋</h1>

            <p>
                前端开发学习中 🚀
            </p>

        </div>

        <!-- Todo App -->
        <div class="todo-box">

            <h2>我的 Todo List ✨</h2>

            <div class="input-area">

                <input
                    type="text"
                    id="todo-input"
                    placeholder="输入新的任务..."
                >

                <button onclick="addTodo()">
                    添加
                </button>

            </div>

            <ul id="todo-list"></ul>

        </div>

    </div>

<script>

function addTodo() {

    const input = document.getElementById("todo-input");

    const text = input.value;

    if(text === "") {
        return;
    }

    const li = document.createElement("li");

    li.innerHTML = `
        ${text}
        <button onclick="removeTodo(this)">
            删除
        </button>
    `;

    document.getElementById("todo-list").appendChild(li);

    input.value = "";
}

function removeTodo(button) {

    button.parentElement.remove();

}

</script>

</body>
</html>
