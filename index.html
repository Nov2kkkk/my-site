<!DOCTYPE html>
<html lang="zh">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Panyuting Portfolio</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- 背景 -->

    <div class="background">

        <div class="blur blur1"></div>
        <div class="blur blur2"></div>

    </div>

    <!-- 页面 -->

    <main class="container">

        <!-- Hero -->

        <section class="hero">

            <img
                src="avatar.jpg"
                class="avatar"
            >

            <h1>
                Building Future
                <span>AI Experiences</span>
            </h1>

            <p>
                Frontend Developer · UI Designer · AI Explorer
            </p>

            <div class="hero-buttons">

                <a
                    href="https://github.com/Nov2kkkk"
                    target="_blank"
                >
                    GitHub
                </a>

                <a href="#projects">
                    Projects
                </a>

            </div>

        </section>

        <!-- Projects -->

        <section
            class="projects"
            id="projects"
        >

            <h2>
                Featured Projects
            </h2>

            <div class="project-grid">

                <!-- AI CHAT -->

                <div class="card">

                    <h3>
                        AI Chat App 🚀
                    </h3>

                    <p>
                        OpenAI 风格 AI 聊天应用，
                        支持现代聊天 UI 与流畅交互体验。
                    </p>

                    <div class="card-buttons">

                        <a
                            href="https://my-ai-chat-omega-steel.vercel.app"
                            target="_blank"
                        >
                            Live Demo
                        </a>

                        <a
                            href="https://github.com/Nov2kkkk"
                            target="_blank"
                        >
                            GitHub
                        </a>

                    </div>

                </div>

                <!-- WEBSITE -->

                <div class="card">

                    <h3>
                        Portfolio Website ✨
                    </h3>

                    <p>
                        Apple 风格个人作品集网站，
                        带高级动画与毛玻璃设计。
                    </p>

                </div>

                <!-- FUTURE -->

                <div class="card">

                    <h3>
                        Future Projects 🌌
                    </h3>

                    <p>
                        更多 AI Web App 与高级前端项目开发中。
                    </p>

                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
